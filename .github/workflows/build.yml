name: Build APK

on:
  workflow_dispatch: # 手动触发

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    # 1. 拉取当前的工具链代码
    - name: Checkout AutoBuild Tools
      uses: actions/checkout@v4

    # 2. 拉取 FongMi/TV 官方源码
    - name: Checkout FongMi TV Source
      uses: actions/checkout@v4
      with:
        repository: 'FongMi/TV'
        path: 'TV'

    # 3. 设置编译所需的 Java 17 环境
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 4. 【核心修复】不仅注入 SDK 路径，同时注入 Ubuntu 服务器自带的 Python3 路径，彻底解决 Chaquopy 报错
    - name: Create local.properties
      run: |
        echo "sdk.dir=/usr/local/lib/android/sdk" > ./TV/local.properties
        echo "chaquopy.python=/usr/bin/python3" >> ./TV/local.properties
        cp ./TV/local.properties ./TV/app/local.properties

    # 5. 赋予 gradlew 执行权限
    - name: Grant execute permission for gradlew
      run: chmod +x ./TV/gradlew

    # 6. 执行编译（忽略 Lint 拼写检查，防止因为官方代码警告导致被迫中断）
    - name: Build Release APK
      run: |
        cd TV
        ./gradlew assembleRelease -x lint --no-daemon

    # 7. 上传生成的 APK 安装包
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FongMi-TV-APK
        path: |
          TV/app/build/outputs/apk/**/*.apk
          TV/mobile/build/outputs/apk/**/*.apk
