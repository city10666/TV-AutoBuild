name: Build APK

on:
  workflow_dispatch: # 手动触发

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    # 1. 先拉取你当前的工具链代码
    - name: Checkout AutoBuild Tools
      uses: actions/checkout@v4

    # 2. 关键步骤：把 FongMi/TV 官方的源码拉取到当前目录下的 TV 文件夹中
    - name: Checkout FongMi TV Source
      uses: actions/checkout@v4
      with:
        repository: 'FongMi/TV'
        path: 'TV' # 将官方源码下载到 TV 目录

    # 3. 配置 Java 环境
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 4. 进入 TV 目录赋予执行权限
    - name: Grant execute permission for gradlew
      run: chmod +x ./TV/gradlew

    # 5. 进入 TV 目录并执行编译
    - name: Build Release APK
      run: |
        cd TV
        ./gradlew assembleRelease --no-daemon

    # 6. 收集并上传生成的 APK
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FongMi-TV-APK
        path: |
          TV/app/build/outputs/apk/**/*.apk
          TV/mobile/build/outputs/apk/**/*.apk
